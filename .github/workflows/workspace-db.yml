name: Workspace database checks

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'scripts/test_workspace_db.sh'
      - '.github/workflows/workspace-db.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'scripts/test_workspace_db.sh'
      - '.github/workflows/workspace-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test migration and RLS in disposable PostgreSQL
        run: bash scripts/test_workspace_db.sh
